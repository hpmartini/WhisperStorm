name: WhisperStorm
options:
  bundleIdPrefix: de.martinilabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.0.0

targets:
  WhisperStormTests:
    type: bundle.unit-test
    platform: macOS
    # Unhosted on purpose: a hosted run launches the real app (hotkeys, model load, and it rebinds the user's control.sock).
    # The pure units under test are compiled straight into the bundle instead.
    sources:
      - Tests
      - path: Sources
        includes:
          - App/AppState.swift
          - Audio/OutputDucker.swift
          - Support/FileLog.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        OTHER_CODE_SIGN_FLAGS: ""
  WhisperStorm:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: KeyboardShortcuts
      - package: ArgmaxOSS
        product: WhisperKit
    scheme:
      testTargets: [WhisperStormTests]
      gatherCoverageData: false
    entitlements:
      path: WhisperStorm.entitlements
      properties:
        # Hardened Runtime restricts audio input unless this entitlement is present.
        com.apple.security.device.audio-input: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: WhisperStorm
        CFBundleDisplayName: WhisperStorm
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Menu bar app: no Dock icon, no app switcher entry.
        LSUIElement: true
        NSMicrophoneUsageDescription: WhisperStorm records audio from your microphone to transcribe your dictation locally on this Mac. Audio never leaves your machine.
        NSHumanReadableCopyright: © 2026 Martini Labs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.martinilabs.WhisperStorm
        MARKETING_VERSION: "1.0.0"
        SWIFT_VERSION: "5.0"
        # No App Sandbox: CGEvent posting and AXIsProcessTrusted require a non-sandboxed process.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Stable self-signed identity so the Accessibility/TCC grant survives
        # rebuilds. Ad-hoc signing ("-") changes the cdhash every build, which
        # silently invalidates the grant and breaks text insertion.
        # Create the identity once with scripts/setup-signing.sh; if it is
        # missing, codesign falls back to ad-hoc and you must re-grant after
        # each build (see README).
        CODE_SIGN_IDENTITY: "WhisperStorm Dev"
        CODE_SIGN_STYLE: Manual
        OTHER_CODE_SIGN_FLAGS: "--keychain $(HOME)/Library/Keychains/whisperstorm-dev.keychain-db"
        SWIFT_STRICT_CONCURRENCY: minimal
